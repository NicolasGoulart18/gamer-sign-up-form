<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer Sign-up Form</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <a href="">YOUDEV</a>
      <h1>JOIN THE DEVIS</h1>
      <p>Inicialize sua identidade YOUDEV </p>
    </section>

    <section class="signup">
      <form id="signup-form">
        <h2>CRIAR SUA CONTA DEVI</h2>
        <p>Todos os campos são obrigatórios</p>
       <div class="field">
          <label for="nome-devi">Nome DEVI</label>
          <input type="text" name="nome-devi" id="nome-devi" placeholder="Ex: Nicolas_dev">
          <p class="hint">3-20 caracteres: letras, números, _ ou -</p>
       </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="Ex: usuario@email.com">
        </div>

      <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha">          
          <p class="hint">Mínimo de 8 caracteres</p>        
      </div>

        <div class="field">
          <label for="confirmarSenha">Confirmar senha</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha">
        </div>
        
        <div class="terms">
          <input type="checkbox" id="termos" name="termos">        
          <label for="termos">Eu aceito os Termos e a Política de Privacidade</label>
        </div>

        <button type="submit">CRIAR CONTA</button>
      </form>
    </section>
  </main>
</body>
</html>
